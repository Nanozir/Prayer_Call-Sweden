name: Hämta böneutrop

# Fetches and processes the CC0 adhan recording, then commits the result to the
# same branch. Runs when the fetch script changes, or manually.
on:
  push:
    paths: ['scripts/fetch-adhan.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installera ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Hämta och bearbeta
        run: scripts/fetch-adhan.sh
      - name: Committa ljudfilen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/raw/salah_adhan.ogg public/sounds/salah_adhan.ogg assets-src/ADHAN-SOURCE.md
          git diff --cached --quiet && { echo "Ingen ändring."; exit 0; }
          git commit -m "Add adhan notification sound (CC0, Wikimedia Commons)"
          git push
