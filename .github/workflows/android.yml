name: Bygg Android-app

# Every push builds and tests the app (APK available under the run's artifacts).
# Pushing a version tag (v1.2.3) additionally publishes a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installera beroenden
        run: npm ci

      - name: Läs version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Kontrollera att taggen matchar package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Taggen $GITHUB_REF_NAME matchar inte package.json (${{ steps.version.outputs.version }})"
            exit 1
          fi
          node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Enhetstester
        run: npm test

      - name: Bygg webbdelen
        run: npm run build

      - name: Synka till Android
        run: npx cap sync android

      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Döp om APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Salah-kalender-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Salah-kalender-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: Salah-kalender-v*.apk

      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Salah-kalender v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: Salah-kalender-v*.apk
          make_latest: true
