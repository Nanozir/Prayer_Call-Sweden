name: Bygg Android-app

# Every push builds and tests the app (APK available under the run's artifacts).
# On main, when package.json holds a version that has no release yet, the build
# is published as GitHub Release vX.Y.Z (tag created automatically), with the
# matching CHANGELOG.md section as release notes. Other branches (e.g. the daily
# check's PRs) never publish – a release happens only after review and merge.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Installera beroenden
        run: npm ci

      - name: Säkerhetskontroll av beroenden
        run: npm audit --omit=dev --audit-level=high

      - name: Läs version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Är detta en ny version?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Gren $GITHUB_REF_NAME – releaser publiceras bara från main."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            # Still validate the changelog so the PR fails early if it is missing.
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag finns redan – bygger utan att publicera."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # Fails the build if CHANGELOG.md lacks a section for the new version.
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enhetstester
        run: npm test

      - name: Bygg webbdelen
        run: npm run build

      - name: Synka till Android
        run: npx cap sync android

      - name: Hämta signeringsnyckel
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signerar med nyckeln från GitHub Secrets."
          else
            echo "::warning::Inga signeringssecrets – signerar med reservnyckeln i repot."
          fi

      - name: Bygg APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # APK for direct install (GitHub), AAB for Google Play.
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Kontrollera att OCR-filer och ljud finns i APK:n
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep 'assets/public/tesseract/' || true
          for f in worker.min.js lang/eng.traineddata.bin core/tesseract-core-simd-lstm.wasm.js core/tesseract-core-lstm.wasm.js; do
            unzip -l "$apk" "assets/public/tesseract/$f" >/dev/null || { echo "::error::$f saknas i APK:n"; exit 1; }
          done
          # Release builds shorten resource file paths, so check resource names instead.
          resources="$("$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/aapt2" dump resources "$apk")"
          for f in salah_adhan salah_bells salah_chime salah_silent; do
            grep "raw/$f" <<< "$resources" || { echo "::error::Notisljudet $f saknas i APK:n"; exit 1; }
          done

      - name: Döp om APK
        run: |
          apk="Salah-kalender-v${{ steps.version.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # Android App Bundle for Google Play (Play Console → Internt test → Skapa ny version).
          cp android/app/build/outputs/bundle/release/app-release.aab "Salah-kalender-v${{ steps.version.outputs.version }}-google-play.aab"
          # Print the signing certificate so anyone can verify who signed the APK.
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | tee signing-cert.txt
          if [ -f release-notes.md ]; then
            {
              echo; echo "### Verifiering"
              echo "- APK SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`"
              echo "- Signeringscertifikat SHA-256: \`$(grep -m1 'SHA-256' signing-cert.txt | awk '{print $NF}')\`"
            } >> release-notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Salah-kalender-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            Salah-kalender-v*.apk
            Salah-kalender-v*.apk.sha256
            Salah-kalender-v*-google-play.aab

      - name: Publicera release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Salah-kalender v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            Salah-kalender-v*.apk
            Salah-kalender-v*.apk.sha256
            Salah-kalender-v*-google-play.aab
          make_latest: true
