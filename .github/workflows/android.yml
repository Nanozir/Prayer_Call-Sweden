name: Bygg Android-app

# Every push builds and tests the app (APK available under the run's artifacts).
# When package.json holds a version that has no release yet, the build is
# published as GitHub Release vX.Y.Z (tag created automatically), with the
# matching CHANGELOG.md section as release notes. Bumping the version = releasing.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installera beroenden
        run: npm ci

      - name: Läs version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Är detta en ny version?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag finns redan – bygger utan att publicera."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # Fails the build if CHANGELOG.md lacks a section for the new version.
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enhetstester
        run: npm test

      - name: Bygg webbdelen
        run: npm run build

      - name: Synka till Android
        run: npx cap sync android

      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Döp om APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Salah-kalender-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Salah-kalender-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: Salah-kalender-v*.apk

      - name: Publicera release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Salah-kalender v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: Salah-kalender-v*.apk
          make_latest: true
