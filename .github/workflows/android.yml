name: Bygg Android-app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installera beroenden
        run: npm ci

      - name: Enhetstester
        run: npm test

      - name: Bygg webbdelen
        run: npm run build

      - name: Synka till Android
        run: npx cap sync android

      - name: Bygg APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Döp om APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Salah-kalender.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Salah-kalender-apk
          path: Salah-kalender.apk

      - name: Publicera som release (för enkel nedladdning på telefonen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Salah-kalender (bygge ${{ github.run_number }})
          prerelease: ${{ github.ref_name != 'main' }}
          files: Salah-kalender.apk
